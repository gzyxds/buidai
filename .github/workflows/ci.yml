name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: 类型检查 / Lint / 测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 构建（静态生成，failOnError=true）
        run: npm run build
